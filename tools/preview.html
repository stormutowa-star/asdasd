<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hunter's Greatsword - model preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111411; color: #e8e2d2; font-family: ui-monospace, Consolas, monospace; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 12px 14px; background: rgba(14,17,14,.86); border: 1px solid #3c443a; border-radius: 8px; max-width: 330px; font-size: 12px; line-height: 1.55; }
  #hud h1 { font-size: 15px; margin: 0 0 6px; color: #d9b96a; letter-spacing: .08em; }
  #hud .dim { color: #99a091; }
  #hud select, #hud button { background: #222821; color: #e8e2d2; border: 1px solid #4a5347; border-radius: 4px; padding: 4px 7px; font: inherit; margin-top: 6px; cursor: pointer; }
  #hud button:hover, #hud select:hover { border-color: #d9b96a; }
  #texpanel { position: fixed; right: 12px; bottom: 12px; background: rgba(14,17,14,.86); border: 1px solid #3c443a; border-radius: 8px; padding: 8px; }
  #texpanel canvas { image-rendering: pixelated; display: block; }
  #texpanel .label { font-size: 10px; color: #99a091; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kbd { display: inline-block; border: 1px solid #59614f; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: #252b24; font-size: 11px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>HUNTER'S GREATSWORD</h1>
  <div class="dim">GeckoLib item model • 1/16 block units</div>
  <div style="margin-top:8px">Animation<br>
    <select id="anim"></select>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="play">Pause</button>
    <button id="reset">Restart</button>
    <label class="dim"><input type="checkbox" id="spin"> auto rotate</label>
  </div>
  <div class="dim" style="margin-top:8px">Drag to orbit • wheel to zoom</div>
  <div class="dim">Model: <span id="stats"></span></div>
</div>
<div id="texpanel">
  <div class="label">TEXTURE 128×128</div>
  <canvas id="tex" width="128" height="128" style="width:256px;height:256px"></canvas>
</div>
<script src="vendor/three.min.js"></script>
<script>
(async () => {
  const TEX_SIZE = 128;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111411);
  scene.fog = new THREE.Fog(0x111411, 6, 14);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 100);
  camera.position.set(3.3, 2.6, 4.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.getElementById('app').appendChild(renderer.domElement);

  // Minimal orbit controls so the preview does not need extra libraries.
  let dragging = false, px = 0, py = 0, yaw = 0.62, pitch = 0.24, dist = 6.4;
  const target = new THREE.Vector3(0, 1.55, 0);
  function updateCamera() {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(target.x + Math.sin(yaw) * cp * dist,
                        target.y + sp * dist,
                        target.z + Math.cos(yaw) * cp * dist);
    camera.lookAt(target);
  }
  updateCamera();

  renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
  addEventListener('pointerup', () => dragging = false);
  addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw -= (e.clientX - px) * 0.006;
    pitch = Math.max(-0.35, Math.min(1.25, pitch + (e.clientY - py) * 0.006));
    px = e.clientX; py = e.clientY;
    updateCamera();
  });
  addEventListener('wheel', e => {
    dist = Math.max(2.6, Math.min(11, dist + e.deltaY * 0.003));
    updateCamera();
  }, { passive: true });

  // Lights
  scene.add(new THREE.AmbientLight(0xd7ddcc, 1.15));
  const key = new THREE.DirectionalLight(0xfff1cf, 2.2);
  key.position.set(4, 7, 5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb4ff, 1.2);
  rim.position.set(-5, 3, -4);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffd28a, 0.9);
  fill.position.set(-2, 1.5, 5);
  scene.add(fill);

  const grid = new THREE.GridHelper(8, 32, 0x394235, 0x242b22);
  grid.position.y = 0;
  scene.add(grid);

  // A 1.8 block reference frame, mimicking a player height.
  const refGeo = new THREE.BoxGeometry(0.02, 1.8, 0.02);
  const refMat = new THREE.MeshBasicMaterial({ color: 0x6c7a64, transparent: true, opacity: 0.5 });
  const ref = new THREE.Mesh(refGeo, refMat);
  ref.position.set(-1.4, 0.9, 0);
  scene.add(ref);

  // Load assets
  const [geo, anims] = await Promise.all([
    fetch('../src/main/resources/assets/greatsword/geo/greatsword.geo.json').then(r => r.json()),
    fetch('../src/main/resources/assets/greatsword/animations/greatsword.animation.json').then(r => r.json()),
  ]);

  const texture = new THREE.TextureLoader().load('../src/main/resources/assets/greatsword/textures/item/greatsword.png');
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.flipY = false;
  texture.generateMipmaps = false;

  const material = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.82,
    metalness: 0.08,
    side: THREE.DoubleSide,
  });

  const root = new THREE.Group();
  root.scale.setScalar(1 / 16);
  scene.add(root);

  const FACE_ORDER = ['east', 'west', 'up', 'down', 'south', 'north'];
  const geometry = geo['minecraft:geometry'][0];
  let cubeCount = 0;

  for (const bone of geometry.bones) {
    for (const c of bone.cubes || []) {
      const [ox, oy, oz] = c.origin;
      const [sx, sy, sz] = c.size;
      const g = new THREE.BoxGeometry(sx, sy, sz);
      const uv = g.attributes.uv;

      // BoxGeometry group order: +X, -X, +Y, -Y, +Z, -Z
      for (let f = 0; f < 6; f++) {
        const face = c.uv[FACE_ORDER[f]];
        const [u0, v0] = face.uv;
        const [uw, uh] = face.uv_size;
        for (let i = 0; i < 4; i++) {
          const idx = f * 4 + i;
          const lu = uv.getX(idx);
          const lv = 1 - uv.getY(idx); // BoxGeometry uv has v=1 at the top
          uv.setXY(idx, (u0 + lu * uw) / TEX_SIZE, (v0 + lv * uh) / TEX_SIZE);
        }
      }
      uv.needsUpdate = true;

      const mesh = new THREE.Mesh(g, material);
      mesh.castShadow = false;
      mesh.receiveShadow = false;

      if (c.rotation) {
        const pivot = c.pivot || [ox + sx / 2, oy + sy / 2, oz + sz / 2];
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(pivot[0], pivot[1], pivot[2]);
        pivotGroup.rotation.set(
          THREE.MathUtils.degToRad(c.rotation[0]),
          THREE.MathUtils.degToRad(c.rotation[1]),
          THREE.MathUtils.degToRad(c.rotation[2]));
        mesh.position.set(ox + sx / 2 - pivot[0],
                          oy + sy / 2 - pivot[1],
                          oz + sz / 2 - pivot[2]);
        pivotGroup.add(mesh);
        root.add(pivotGroup);
      } else {
        mesh.position.set(ox + sx / 2, oy + sy / 2, oz + sz / 2);
        root.add(mesh);
      }
      cubeCount++;
    }
  }

  document.getElementById('stats').textContent = `${cubeCount} cubes • ${geometry.bones.length} bones`;

  // Animation selection
  const animationMap = anims.animations;
  const select = document.getElementById('anim');
  const names = Object.keys(animationMap);
  for (const name of names) {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name.replace('animation.greatsword.', '');
    select.appendChild(option);
  }

  let current = null;
  let currentName = '';
  let animTime = 0;
  let playing = true;
  let spin = true;

  function setAnimation(name) {
    currentName = name;
    current = animationMap[name];
    animTime = 0;
    playing = true;
    document.getElementById('play').textContent = 'Pause';
  }

  select.addEventListener('change', () => setAnimation(select.value));
  document.getElementById('play').addEventListener('click', () => {
    playing = !playing;
    document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
  });
  document.getElementById('reset').addEventListener('click', () => { animTime = 0; playing = true; document.getElementById('play').textContent = 'Pause'; });
  document.getElementById('spin').addEventListener('change', e => { spin = e.target.checked; });

  setAnimation(names.includes('animation.greatsword.idle') ? 'animation.greatsword.idle' : names[0]);
  select.value = currentName;

  function sampleBone(anim, boneName, time) {
    const bone = anim.bones && anim.bones[boneName];
    if (!bone || !bone.rotation) return [0, 0, 0];
    const entries = Object.entries(bone.rotation)
      .map(([t, v]) => [parseFloat(t), v])
      .sort((a, b) => a[0] - b[0]);
    if (entries.length === 0) return [0, 0, 0];
    if (time <= entries[0][0]) return entries[0][1];
    if (time >= entries[entries.length - 1][0]) return entries[entries.length - 1][1];
    for (let i = 0; i < entries.length - 1; i++) {
      const [t0, v0] = entries[i];
      const [t1, v1] = entries[i + 1];
      if (time >= t0 && time <= t1) {
        const k = (time - t0) / Math.max(1e-6, t1 - t0);
        return [v0[0] + (v1[0] - v0[0]) * k,
                v0[1] + (v1[1] - v0[1]) * k,
                v0[2] + (v1[2] - v0[2]) * k];
      }
    }
    return entries[entries.length - 1][1];
  }

  const clock = new THREE.Clock();
  let orbit = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (current) {
      if (playing) {
        animTime += dt;
        const len = current.animation_length || 1;
        const hold = current.loop === 'hold_on_last_frame';
        if (animTime > len) {
          if (hold) animTime = len;
          else animTime = 0;
        }
      }
      const rot = sampleBone(current, 'root', animTime);
      root.rotation.set(THREE.MathUtils.degToRad(-rot[0]),
                        THREE.MathUtils.degToRad(rot[1]),
                        THREE.MathUtils.degToRad(-rot[2]));
    }

    if (spin) {
      orbit += dt * 0.12;
      yaw = 0.62 + orbit;
      updateCamera();
    }

    renderer.render(scene, camera);
  }
  animate();

  // 2D texture preview
  const canvas = document.getElementById('tex');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, 128, 128);
    ctx.drawImage(img, 0, 0);
  };
  img.src = '../src/main/resources/assets/greatsword/textures/item/greatsword.png';

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
