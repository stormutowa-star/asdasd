name: Ludo Kressh Sword (Minecraft)

on:
  push:
    paths:
      - 'minecraft/LudoKresshSword/**'
      - '.github/workflows/ludokressh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: minecraft/LudoKresshSword
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the latest Forge for Minecraft 1.21.1
        run: |
          v=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
              | grep -o '<version>1\.21\.1-[0-9.]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "Forge: $v"
          sed -i "s/^forge_version=.*/forge_version=${v#1.21.1-}/" gradle.properties
          grep -E '^(mc|forge)_version' gradle.properties

      - name: Build the mod
        id: build
        run: |
          chmod +x gradlew
          if ! ./gradlew build --no-daemon --info > build.log 2>&1; then
            echo "=== build failed; relevant output ==="
            grep -vE "^\s+at |^\s+\.\.\. [0-9]+ more" build.log | grep -iE -B2 -A8 "error|exception|failed|caused by|mavenizer" | tail -200
            find . ~/.gradle -path '*mavenizer*' -name '*.log' 2>/dev/null | head -5 | while read f; do echo "=== $f"; tail -60 "$f"; done
            exit 1
          fi
          grep -E "BUILD|Task :compileJava" build.log | tail -5
          mkdir -p dist
          cp build/libs/ludokressh-*.jar dist/
          unzip -l dist/ludokressh-*.jar

      - name: Commit the jar to the branch
        if: always() && steps.build.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.jar
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Build Ludo Kressh Sword jar for Minecraft [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
