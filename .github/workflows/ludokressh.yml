name: Ludo Kressh Sword (Minecraft)

on:
  push:
    paths:
      - 'minecraft/LudoKresshSword/**'
      - '.github/workflows/ludokressh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: minecraft/LudoKresshSword
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the latest Forge for Minecraft 1.21.1
        run: |
          v=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
              | grep -o '<version>1\.21\.1-[0-9.]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "Forge: $v"
          sed -i "s/^forge_version=.*/forge_version=${v#1.21.1-}/" gradle.properties
          grep -E '^(mc|forge)_version' gradle.properties

      - name: Build the mod
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          mkdir -p dist
          cp build/libs/ludokressh-*.jar dist/
          unzip -l dist/ludokressh-*.jar

      - name: Server smoke test (registries, recipe, effects)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout -k 30 900 ./gradlew runGameTestServer --no-daemon > gametest.log 2>&1 || echo "gametest exit $?"
          LOG=$(ls -t run/logs/latest.log run*/logs/latest.log 2>/dev/null | head -1)
          echo "log: $LOG"
          grep -iE "ludokressh|exception|error" "$LOG" | grep -viE "realms|telemetry|authlib" | head -80 || true
          if grep -iE "(ERROR|Exception).*ludokressh|ludokressh.*(ERROR|Exception|Couldn't parse)" "$LOG"; then echo "::error::server problems"; exit 1; fi

      - name: Client smoke test (model + texture + screenshot)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          cp ci/CiPreview.java src/main/java/com/ricardo/ludokressh/
          rm -f run/screenshots/ludokressh_gui.png
          xvfb-run -a -s "-screen 0 1280x720x24" timeout -k 30 1200 ./gradlew runClient --no-daemon > client.log 2>&1 || echo "client exit $?"
          rm src/main/java/com/ricardo/ludokressh/CiPreview.java
          LOG=run/logs/latest.log
          grep -iE "ludokressh|missing texture|unable to load model|exception loading|failed to load model|OpenGL|GL_RENDERER" "$LOG" | head -80 || true
          tail -40 client.log
          mkdir -p preview
          cp run/screenshots/ludokressh_gui.png preview/minecraft-gui.png
          if grep -iE "(ERROR|Exception|Unable|Failed).*ludokressh|Missing textures in model ludokressh" "$LOG"; then echo "::error::client problems"; exit 1; fi

      - name: Commit the jar and the preview to the branch
        if: always() && steps.build.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.jar
          [ -f preview/minecraft-gui.png ] && git add preview/minecraft-gui.png
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Build Ludo Kressh Sword jar for Minecraft [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
