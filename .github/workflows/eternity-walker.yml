name: Build Eternity Walker
on:
  workflow_dispatch:
  push:
    paths:
      - 'eternity-walker/**'
      - '.github/workflows/eternity-walker.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: eternity-walker
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eternitywalker-jar
          path: eternity-walker/build/libs/*.jar
      - name: Commit jar to the branch (so it can be fetched with git)
        if: github.ref_type == 'branch'
        run: |
          mkdir -p eternity-walker-dist
          cp eternity-walker/build/libs/*.jar eternity-walker-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f eternity-walker-dist
          git commit -m "Build artifact: Eternity Walker jar" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
