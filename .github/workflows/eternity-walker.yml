name: Build Eternity Walker
on:
  workflow_dispatch:
  push:
    paths:
      - 'eternity-walker/**'
      - '.github/workflows/eternity-walker.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: eternity-walker
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eternitywalker-jar
          path: eternity-walker/build/libs/*.jar
