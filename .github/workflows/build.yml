name: Compilar Mario

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar mod Mario
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Usar la ultima version de Forge para 1.21.1
        run: |
          VER=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -oE '1\.21\.1-[0-9.]+' | sed 's/^1\.21\.1-//' | sort -V | tail -n1 || true)
          if [ -n "$VER" ]; then
            sed -i "s/^forge_version=.*/forge_version=$VER/" gradle.properties
          fi
          grep '^forge_version' gradle.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1
          EC=$?
          tail -n 120 build.log
          exit $EC

      - name: Resumen de errores de compilacion
        if: failure()
        run: |
          python3 - <<'PY'
          import re

          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          picked = []
          for i, line in enumerate(lines):
              if re.search(r'error:|What went wrong|Caused by|FAILURE:|Could not |Execution failed', line):
                  picked.extend(lines[max(0, i - 2): i + 4])
                  picked.append('---')
          if not picked:
              picked = lines[-80:]

          text = '\n'.join(picked)
          chunks = [text[k:k + 2500] for k in range(0, len(text), 2500)][:8]
          for n, chunk in enumerate(chunks, 1):
              msg = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Error {n}/{len(chunks)}::{msg}')
          PY

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: mario-mod
          path: build/libs/mario-*.jar
          if-no-files-found: error

      - name: Publicar el jar en la rama mario-jar
        if: github.ref == 'refs/heads/mario'
        run: |
          mkdir -p /tmp/jarout
          for f in build/libs/mario-*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar|*-slim.jar) continue;; esac
            cp "$f" /tmp/jarout/
          done
          ls -la /tmp/jarout
          cd /tmp/jarout
          git init -q
          git checkout -q -b mario-jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Jar compilado de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mario-jar
