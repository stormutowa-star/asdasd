name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: gradle build --stacktrace --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: lenadorbosque-jar
          path: build/libs/*.jar
          if-no-files-found: error
