name: Compilar Mario

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar mod Mario
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Usar la ultima version de Forge para 1.21.1
        run: |
          VER=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -oE '1\.21\.1-[0-9.]+' | sed 's/^1\.21\.1-//' | sort -V | tail -n1 || true)
          if [ -n "$VER" ]; then
            sed -i "s/^forge_version=.*/forge_version=$VER/" gradle.properties
          fi
          grep '^forge_version' gradle.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: mario-mod
          path: build/libs/mario-*.jar
          if-no-files-found: error
