name: Prueba temporal SJP

on:
  push:
    branches: [sjp-smoke-test]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Forge mas reciente para 1.21.1
        run: |
          VER=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml \
            | grep -oE '1\.21\.1-[0-9.]+' | sed 's/^1\.21\.1-//' | sort -V | tail -n1 || true)
          if [ -n "$VER" ]; then sed -i "s/^forge_version=.*/forge_version=$VER/" gradle.properties; fi

      - name: Servidor y prueba del Super Jump Punch
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          rm -f /tmp/mc-cmd
          mkfifo /tmp/mc-cmd
          timeout 1500 ./gradlew runServer --no-daemon --console=plain < /tmp/mc-cmd > gradle-server.log 2>&1 &
          GPID=$!
          exec 3> /tmp/mc-cmd
          for i in $(seq 1 300); do
            grep -q 'Done (' run/logs/latest.log 2>/dev/null && break
            sleep 4
          done
          echo "forceload add -16 -16 16 16" >&3
          echo "time set 18000" >&3
          echo "gamerule doDaylightCycle false" >&3
          sleep 3
          echo "fill -6 100 -6 6 100 6 minecraft:stone" >&3
          sleep 2
          echo "summon mario:mario 0 101 0" >&3
          sleep 1
          echo "summon minecraft:zombie 2 101 0" >&3
          echo "summon minecraft:zombie -2 101 1" >&3
          for i in $(seq 1 60); do
            echo "execute if entity @e[type=mario:mario_coin] run say COIN_SEEN" >&3
            echo "data get entity @e[type=mario:mario,limit=1] Pos" >&3
            echo "data get entity @e[type=minecraft:zombie,limit=1] Health" >&3
            sleep 1
          done
          echo "stop" >&3
          exec 3>&-
          wait $GPID || true

      - name: Preparar resultados
        if: always()
        run: |
          {
            echo "== Arranque"; grep -E 'Done \(' run/logs/latest.log || echo "SIN ARRANQUE"
            echo "== Coins vistas: $(grep -c 'COIN_SEEN' run/logs/latest.log || true)"
            echo "== Lecturas (Pos / Health):"
            grep -E 'following entity data' run/logs/latest.log || true
            echo "== Errores y excepciones:"
            grep -nEi 'exception|error|crash' run/logs/latest.log | head -200 || true
            echo "== Final de gradle:"
            tail -n 80 gradle-server.log || true
          } > smoke-result.txt
          cp smoke-result.txt /tmp/smoke-result.txt
          head -c 3000 smoke-result.txt

      - name: Subir resultados a la rama sjp-smoke-results
        if: always()
        run: |
          git config user.name "smoke-bot"
          git config user.email "smoke-bot@users.noreply.github.com"
          git checkout --orphan smoke-tmp-branch
          git rm -r -q --cached . || true
          cp /tmp/smoke-result.txt ./smoke-result.txt
          git add smoke-result.txt
          git commit -qm "Resultado smoke test SJP ${GITHUB_SHA}"
          git push -f origin HEAD:refs/heads/sjp-smoke-results
