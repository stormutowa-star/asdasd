name: YGO Duel (Godot + ocgcore)

on:
  push:
    paths:
      - "ygo-duel-godot/**"
      - ".github/workflows/ygo-duel-godot.yml"
      - ".gitmodules"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    # Ubuntu 22.04 para que la .so funcione también en distros algo más antiguas
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ygo-duel-godot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix xvfb
          pip install scons
          python tools/get_sqlite.py

      - name: Compilar extensión (Linux)
        run: |
          scons platform=linux target=template_debug -j4
          scons platform=linux target=template_release -j4

      - name: Compilar extensión (Windows, MinGW)
        run: |
          scons platform=windows use_mingw=yes target=template_debug -j4
          scons platform=windows use_mingw=yes target=template_release -j4

      - name: Descargar Godot y plantillas de exportación
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j templates.tpz "templates/linux_*x86_64*" "templates/windows_*x86_64*" "templates/version.txt" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Prueba IA contra IA (sin interfaz)
        run: |
          ~/godot/godot --headless --path game --import || true
          ~/godot/godot --headless --path game res://tests/ai_vs_ai.tscn -- 6 2024

      - name: Exportar
        run: |
          mkdir -p game/export/windows game/export/linux
          ~/godot/godot --headless --path game --export-release "Windows Desktop" export/windows/YGODuel.exe
          ~/godot/godot --headless --path game --export-release "Linux" export/linux/YGODuel.x86_64
          ls -la game/export/*

      - name: Añadir base de cartas completa (expansions/) y carpetas Decks/pics
        run: |
          git clone --depth 1 https://github.com/ProjectIgnis/CardScripts ../cs
          git clone --depth 1 https://github.com/ProjectIgnis/BabelCDB ../cdb
          for d in game/export/windows game/export/linux; do
            mkdir -p $d/expansions/script $d/Decks $d/pics
            cp ../cs/*.lua $d/expansions/script/
            cp -r ../cs/official ../cs/pre-release $d/expansions/script/
            cp ../cdb/cards.cdb ../cdb/release-*.cdb $d/expansions/
            for f in ../cdb/prerelease-*.cdb; do case $f in *rush*) ;; *) cp $f $d/expansions/;; esac; done
            date -u +%Y-%m-%dT%H:%M:%S > $d/expansions/version.txt
            cp game/Decks/*.ydk $d/Decks/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ygo-duel-windows
          path: ygo-duel-godot/game/export/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: ygo-duel-linux
          path: ygo-duel-godot/game/export/linux/

      - name: Preparar proyecto para el editor
        run: |
          mkdir -p ../dist
          rsync -a --exclude ".godot" --exclude "export" game/ ../dist/ygo-duel-godot-proyecto/

      - uses: actions/upload-artifact@v4
        with:
          name: ygo-duel-proyecto-godot
          path: dist/ygo-duel-godot-proyecto/
