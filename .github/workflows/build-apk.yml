name: Build APK

on:
  push:
    branches: [android-screen-translator]
    paths:
      - 'screen-translator/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: screen-translator
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp screen-translator/app/build/outputs/apk/debug/app-debug.apk TraductorPantalla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TraductorPantalla-apk
          path: TraductorPantalla.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" TraductorPantalla.apk \
            --title "Traductor Pantalla (build ${{ github.run_number }})" \
            --notes "APK debug firmada, lista para instalar."
