plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.1.0'
group = 'com.keinloree'

base {
    archivesName = 'keinloree'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: project.mc_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('client') {
            // Banco de pruebas: ./gradlew runClient -Pautotest=basic
            if (providers.gradleProperty('autotest').isPresent()) {
                systemProperty 'keinloree.autotest', providers.gradleProperty('autotest').get()
            }
        }

        register('server') {
            args '--nogui'
            // Banco de pruebas: ./gradlew runServer -Pservertest=smoke
            if (providers.gradleProperty('servertest').isPresent()) {
                systemProperty 'keinloree.servertest', providers.gradleProperty('servertest').get()
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.mc_version}-${project.forge_version}".toString())
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
